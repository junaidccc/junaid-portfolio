<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0f0f11"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Application Window Mockup -->
  <rect x="100" y="50" width="600" height="400" rx="12" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="100" y="50" width="600" height="44" rx="12" fill="#141416" stroke="#27272a" stroke-width="1"/>
  <circle cx="128" cy="72" r="5" fill="#3f3f46"/>
  <circle cx="144" cy="72" r="5" fill="#3f3f46"/>
  <circle cx="160" cy="72" r="5" fill="#3f3f46"/>
  <text x="400" y="77" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#71717a" text-anchor="middle" letter-spacing="1">TASK ARCHIVE // SYSTEM V1.0</text>

  <!-- Input Field Mockup -->
  <rect x="140" y="115" width="520" height="42" rx="8" fill="#1f1f23" stroke="#3f3f46" stroke-width="1"/>
  <text x="160" y="141" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#a1a1aa">+ Add high priority objective...</text>
  <rect x="600" y="123" width="50" height="26" rx="4" fill="#ffffff"/>
  <text x="625" y="140" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">ADD</text>

  <!-- Task Items -->
  <!-- Item 1 (Completed) -->
  <g transform="translate(140, 180)">
    <rect width="520" height="52" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <circle cx="30" cy="26" r="9" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
    <path d="M26 26 L29 29 L35 23" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="54" y="30" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" fill="#71717a" text-decoration="line-through">Design system token architecture</text>
    <rect x="440" y="16" width="60" height="20" rx="4" fill="#27272a"/>
    <text x="470" y="30" font-family="'Space Mono', monospace" font-size="9" fill="#a1a1aa" text-anchor="middle">DONE</text>
  </g>

  <!-- Item 2 (Active) -->
  <g transform="translate(140, 245)">
    <rect width="520" height="52" rx="8" fill="#222226" stroke="#52525b" stroke-width="1.5"/>
    <circle cx="30" cy="26" r="9" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="54" y="30" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="500" fill="#ffffff">Refactor task state persistence &amp; drag reorder</text>
    <rect x="430" y="16" width="70" height="20" rx="4" fill="#ffffff"/>
    <text x="465" y="30" font-family="'Space Mono', monospace" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- Item 3 (Pending) -->
  <g transform="translate(140, 310)">
    <rect width="520" height="52" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <circle cx="30" cy="26" r="9" fill="none" stroke="#52525b" stroke-width="1.5"/>
    <text x="54" y="30" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" fill="#a1a1aa">Implement dark mode localStorage sync</text>
    <rect x="430" y="16" width="70" height="20" rx="4" fill="#27272a"/>
    <text x="465" y="30" font-family="'Space Mono', monospace" font-size="9" fill="#71717a" text-anchor="middle">QUEUED</text>
  </g>

  <!-- Footer Stats -->
  <g transform="translate(140, 385)">
    <text x="0" y="15" font-family="'Space Mono', monospace" font-size="11" fill="#71717a">3 TOTAL  •  1 COMPLETED  •  LOCAL STORAGE READY</text>
  </g>
</svg>
