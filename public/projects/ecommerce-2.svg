<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#151518"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#techBg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Application Window -->
  <rect x="90" y="45" width="620" height="410" rx="12" fill="#0e0e12" stroke="#27272a" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="90" y="45" width="620" height="45" rx="12" fill="#15151a" stroke="#27272a" stroke-width="1"/>
  <circle cx="118" cy="67" r="5" fill="#3f3f46"/>
  <circle cx="134" cy="67" r="5" fill="#3f3f46"/>
  <circle cx="150" cy="67" r="5" fill="#3f3f46"/>
  <text x="180" y="72" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="2">AUDIO PHONIC // LABS</text>
  <rect x="580" y="56" width="110" height="24" rx="4" fill="#ffffff"/>
  <text x="635" y="72" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">PRE-ORDER NOW</text>

  <!-- Product Showcase Split -->
  <!-- Left Side: Interactive 3D Audio Visual Wireframe -->
  <g transform="translate(115, 110)">
    <rect width="280" height="320" rx="8" fill="#131317" stroke="#27272a" stroke-width="1"/>
    <!-- Concentric audio wave rings -->
    <circle cx="140" cy="140" r="100" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="140" cy="140" r="70" fill="none" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="140" cy="140" r="45" fill="none" stroke="#71717a" stroke-width="1.5"/>
    <circle cx="140" cy="140" r="20" fill="#ffffff"/>
    <text x="140" y="275" font-family="'Space Mono', monospace" font-size="11" fill="#a1a1aa" text-anchor="middle">PRECISION ACOUSTIC TRANSDUCER</text>
    <text x="140" y="295" font-family="'Space Mono', monospace" font-size="10" fill="#71717a" text-anchor="middle">360° SPATIAL SOUND FIELD</text>
  </g>

  <!-- Right Side: Specs & Cart Checkout Flow -->
  <g transform="translate(420, 110)">
    <text x="0" y="20" font-family="'Space Mono', monospace" font-size="11" fill="#71717a" letter-spacing="2">SERIES ZERO / 01</text>
    <text x="0" y="48" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">STUDIO MONITORS</text>
    <text x="0" y="74" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#a1a1aa">Custom planar magnetic drivers with beryllium diaphragm and milled aluminum chassis.</text>

    <!-- Specs List -->
    <g transform="translate(0, 105)">
      <rect width="265" height="35" rx="4" fill="#18181c" stroke="#27272a" stroke-width="1"/>
      <text x="12" y="22" font-family="'Space Mono', monospace" font-size="11" fill="#a1a1aa">FREQUENCY</text>
      <text x="250" y="22" font-family="'Space Mono', monospace" font-size="11" fill="#ffffff" text-anchor="end">10Hz - 48kHz</text>
    </g>

    <g transform="translate(0, 150)">
      <rect width="265" height="35" rx="4" fill="#18181c" stroke="#27272a" stroke-width="1"/>
      <text x="12" y="22" font-family="'Space Mono', monospace" font-size="11" fill="#a1a1aa">LATENCY</text>
      <text x="250" y="22" font-family="'Space Mono', monospace" font-size="11" fill="#ffffff" text-anchor="end">&lt; 1.2ms (Ultra-Low)</text>
    </g>

    <g transform="translate(0, 195)">
      <rect width="265" height="35" rx="4" fill="#18181c" stroke="#27272a" stroke-width="1"/>
      <text x="12" y="22" font-family="'Space Mono', monospace" font-size="11" fill="#a1a1aa">CONNECTION</text>
      <text x="250" y="22" font-family="'Space Mono', monospace" font-size="11" fill="#ffffff" text-anchor="end">USB-C / Lossless BT</text>
    </g>

    <!-- Price and Action -->
    <g transform="translate(0, 260)">
      <text x="0" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="700" fill="#ffffff">$499</text>
      <text x="75" y="30" font-family="'Space Mono', monospace" font-size="11" fill="#71717a">USD / PAIR</text>
      <rect x="150" y="10" width="115" height="36" rx="4" fill="#ffffff"/>
      <text x="207" y="33" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">ADD TO CART</text>
    </g>
  </g>
</svg>
