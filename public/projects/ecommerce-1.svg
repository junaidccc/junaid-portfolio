<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#eBg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Browser Frame -->
  <rect x="90" y="45" width="620" height="410" rx="12" fill="#0d0d10" stroke="#27272a" stroke-width="1.5"/>

  <!-- Browser Nav -->
  <rect x="90" y="45" width="620" height="45" rx="12" fill="#141418" stroke="#27272a" stroke-width="1"/>
  <circle cx="118" cy="67" r="5" fill="#3f3f46"/>
  <circle cx="134" cy="67" r="5" fill="#3f3f46"/>
  <circle cx="150" cy="67" r="5" fill="#3f3f46"/>
  <text x="180" y="72" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="2">NOIR ATELIER</text>
  <text x="400" y="72" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#71717a">COLLECTIONS  •  OBJECTS  •  ARCHIVE</text>
  <rect x="635" y="57" width="55" height="22" rx="4" fill="#27272a"/>
  <text x="662" y="72" font-family="'Space Mono', monospace" font-size="10" fill="#ffffff" text-anchor="middle">BAG (2)</text>

  <!-- Hero Banner inside Mockup -->
  <g transform="translate(115, 105)">
    <rect width="570" height="110" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="25" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#a1a1aa" letter-spacing="3">SPRING / SUMMER '26</text>
    <text x="25" y="72" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">MONOCHROME ESSENTIALS</text>
    <rect x="440" y="40" width="105" height="34" rx="4" fill="#ffffff"/>
    <text x="492" y="62" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">EXPLORE</text>
  </g>

  <!-- Product Grid (3 cards) -->
  <!-- Card 1 -->
  <g transform="translate(115, 230)">
    <rect width="176" height="205" rx="8" fill="url(#card1)" stroke="#27272a" stroke-width="1"/>
    <rect x="15" y="15" width="146" height="115" rx="6" fill="#121214"/>
    <!-- Wireframe product silhouette -->
    <rect x="53" y="35" width="70" height="75" rx="4" fill="none" stroke="#52525b" stroke-width="1.5"/>
    <line x1="68" y1="35" x2="108" y2="35" stroke="#ffffff" stroke-width="2"/>
    <text x="15" y="152" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Tailored Overshirt</text>
    <text x="15" y="170" font-family="'Space Mono', monospace" font-size="11" fill="#a1a1aa">$180.00</text>
    <rect x="15" y="180" width="146" height="20" rx="3" fill="#ffffff"/>
    <text x="88" y="194" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">ADD TO BAG</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(312, 230)">
    <rect width="176" height="205" rx="8" fill="url(#card1)" stroke="#27272a" stroke-width="1"/>
    <rect x="15" y="15" width="146" height="115" rx="6" fill="#121214"/>
    <!-- Wireframe silhouette 2 -->
    <circle cx="88" cy="72" r="32" fill="none" stroke="#71717a" stroke-width="1.5"/>
    <line x1="88" y1="50" x2="88" y2="72" stroke="#ffffff" stroke-width="2"/>
    <line x1="88" y1="72" x2="104" y2="72" stroke="#ffffff" stroke-width="2"/>
    <text x="15" y="152" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Minimalist Watch</text>
    <text x="15" y="170" font-family="'Space Mono', monospace" font-size="11" fill="#a1a1aa">$340.00</text>
    <rect x="15" y="180" width="146" height="20" rx="3" fill="#ffffff"/>
    <text x="88" y="194" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">ADD TO BAG</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(509, 230)">
    <rect width="176" height="205" rx="8" fill="url(#card1)" stroke="#27272a" stroke-width="1"/>
    <rect x="15" y="15" width="146" height="115" rx="6" fill="#121214"/>
    <!-- Wireframe silhouette 3 -->
    <path d="M58,95 L88,45 L118,95 Z" fill="none" stroke="#52525b" stroke-width="1.5"/>
    <text x="15" y="152" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Geometric Footwear</text>
    <text x="15" y="170" font-family="'Space Mono', monospace" font-size="11" fill="#a1a1aa">$220.00</text>
    <rect x="15" y="180" width="146" height="20" rx="3" fill="#ffffff"/>
    <text x="88" y="194" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">ADD TO BAG</text>
  </g>
</svg>
